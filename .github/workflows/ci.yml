name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest
        env:
          # Tests never make real Groq calls (llm_client is fully mocked), but
          # config.py raises at import-adjacent points if this is unset in some
          # code paths -- set a dummy value so CI doesn't need a real secret.
          GROQ_API_KEY: "dummy-key-for-ci"
